<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Lenskart Model View</title>
        <meta charset="utf-8">
        <meta name="viewport"
              content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
        <link rel="stylesheet" href="style.css">

        <script type="module" src="/libs/model-viewer.min.js"></script>
        <script nomodule src="/libs/model-viewer-umd.min.js"></script>        
        <style>

            #test-controls-container {
                position: absolute;
                display: flex;
                align-items: start;
                flex-direction: row;
                background-color: rgba(104, 104, 104, 0.5);
                border-radius: 12px;
                gap: 20px;     
                padding: 10px;    
                left: 12px;
                right: auto;
                top: 12px;
                z-index: 1;       
            }

            #test-controls-container.is-collapsed .test-controls {
                display: none;
            }

            .controls-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                color: white;
                font-size: 12px;
            }

            #controls-toggle {
                display: block;
                text-align: center;
                border: 1px solid rgba(255,255,255,0.5);
                background: rgba(0,0,0,0.35);
                color: white;
                min-height: 24px;
                min-width: 24px;
                border-radius: 6px;
                font-size: 12px;
            }

            .test-controls {
                z-index: 1;
                display: flex;
                align-items: stretch;
                flex-direction: column;
                gap: 4px;
                font-size: 12px;
            }     
             
            .test-controls-row {
                z-index: 1;
                display: flex;
                align-items: stretch;
                flex-direction: row;
                gap: 5px;
            }     

            .test-control-value {
                color: white;
                background-color: rgba(0,0,0,0.5);
                padding: 2px 5px;
                border-radius: 3px;
                font-size: 16px;
            }     

            #sku-id-input {
                margin-right: 5px;
            }            

            #exposure-controls {
                min-width: 125px;
            }

            .change-button {
                height: 26px;
            }

            #dropzone {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            #dropzone-target {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background-color: rgba(0,0,0,0);
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.2s ease, background-color 0.2s ease;
                z-index: 2;
            }

            #dropzone-target.is-dragover {
                background-color: rgba(0,0,0,0.35);
                opacity: 1;
            }

            #dropzone-message {
                color: white;
                background-color: rgba(0,0,0,0.45);
                border: 2px dashed rgba(255,255,255,0.85);
                border-radius: 8px;
                padding: 16px 24px;
                font-size: 22px;
                letter-spacing: 0.5px;
            }

            @media (max-width: 1024px) {
                #test-controls-container {
                    flex-direction: column;
                    align-items: stretch;
                    gap: 12px;
                    padding: 12px;
                    width: min(92vw, 360px);
                }

                .test-controls-row {
                    flex-wrap: wrap;
                }

                .test-control-value {
                    font-size: 14px;
                }

                #exposure-controls {
                    min-width: 0;
                }
            }
        </style>
    </head>
    <body>
        <div id="test-controls-container" class="is-collapsed">
            <div class="controls-header">
                <span>Settings</span>
                <button id="controls-toggle" type="button" aria-expanded="false">+</button>
            </div>
            <div id="model-controls" class="test-controls">
                <input type="text" id="sku-id-input" placeholder="Enter SKU ID">
                <div class="test-controls-row">
                    <button id="change-model-l-button">&lt;</button>
                    <div>Change Model <span id="model-index"></span></div>
                    <button id="change-model-r-button">&gt;</button>    
                </div>
                <div id="model-name" class="test-control-value"></div>            
                <div>
                    <button id="glb-browse-button" type="button">Browse</button>
                    <button id="glb-url-button" type="button">URL</button>
                    <input id="glb-file-input" type="file" accept=".glb,model/gltf-binary" hidden multiple>
                </div>
            </div>
            <div id="env-controls" class="test-controls">
                <button id="change-env-button" class="change-button">Change Env</button>
                <div id="env-name" class="test-control-value"></div>
                <div>
                    <button id="browse-env-button" type="button">Browse HDR/JPG</button>
                    <input id="env-file-input" type="file" accept=".hdr,.jpg,.jpeg" hidden multiple>
                </div>                
            </div>     
            <div id="skybox-controls" class="test-controls">
                <button id="change-skybox-button" class="change-button">Change Skybox</button>
                <div id="skybox-name" class="test-control-value"></div>
            </div>       
            <div id="tonemapping-controls" class="test-controls">
                <label for="tone-mapping-select">Tone Mapping</label>
                <select id="tone-mapping-select"></select>
            </div>            
            <div id="exposure-controls" class="test-controls">
                <label for="exposure-slider">Exposure</label>
                <input id="exposure-slider" type="range" min="0.25" max="2.5" step="0.05" value="1.0">
                <span id="exposure-value" class="test-control-value">1.0</span>
            </div>
        </div>

        <div id="card">
            <model-viewer
                id="model-viewer"
                alt="A 3D model of a Eyeglass/Sunglass"
                environment-image="/static/env/env_2.hdr"
                shadow-intensity="1"
                tone-mapping="aces"
                auto-rotate
                camera-controls
                auto-camera-target="bottom">
            </model-viewer>
        </div>
        <div id="dropzone-target">
            <div id="dropzone-message">Drop GLB/HDR/JPG here!</div>
        </div>
    </body>

    <script type="text/javascript">
            const skyboxImages = [
                null,                
                "./skybox/bg_offwhite.jpg",
                "./skybox/bg_grey.jpg",
                "./skybox/bg_beige.jpg",
            ];
            let currentSkybox = 0;

            const assets = [
                { url: "./assets/206272.glb", name: "206272" },
            ]
            let currentAsset = 0;

            const envs = [
                { url: "./env/env_2.hdr", name: "env_2" },
                { url: "./env/env_12.hdr", name: "env_12" },
            ]
            let currentEnv = 0;            
            const toneMappingOptions = [
                { value: "aces", label: "ACES" },
                { value: "linear", label: "Linear" },                
                { value: "neutral", label: "Neutral" },
                { value: "agx", label: "AgX" },
                { value: "reinhard", label: "Reinhard" },
            ];

            function updateSkybox() {
                const skyboxUrl = skyboxImages[currentSkybox];
                modelViewer.setAttribute('skybox-image', skyboxUrl);
                skyboxName.textContent = skyboxUrl ? skyboxUrl.split('/').pop().split('.')[0] : "<none>";
            }

            function updateEnv() {
                const env = envs[currentEnv];
                const envUrl = env ? env.url : null;
                modelViewer.setAttribute('environment-image', envUrl);
                envName.textContent = env ? env.name : "<none>";
            }            

            function getAssetByIndex(index) {
                return assets[index] || null;
            }

            function extractSkuId(fileName) {
                const lowerName = fileName.toLowerCase();
                const glbIndex = lowerName.lastIndexOf(".glb");
                if (glbIndex === -1) {
                    return null;
                }
                const baseName = fileName.slice(0, glbIndex);
                const skuIndex = lowerName.lastIndexOf("sku_");
                const candidate = skuIndex !== -1 ? fileName.slice(skuIndex + 4, glbIndex) : baseName;
                const trimmed = candidate.trim();
                return trimmed ? trimmed : null;
            }

            function setupProductUrls(asset, posterUrl) {
                if (!asset) {
                    asset = getAssetByIndex(currentAsset);
                    if (!asset) return;
                }
                modelName.textContent = asset.name;
                document.getElementById('model-viewer').src = asset.url;
                document.getElementById('model-viewer').poster = posterUrl;

                modelIndex.textContent = `${currentAsset + 1} / ${assets.length}`;   
            }

            function onModelChangeEvent(next = true) {
                const skuId = skuIdInput.value.trim();
                var asset;
                if (skuId) {
                    asset = assets.filter(p => p.name == skuId)[0]
                    if (!asset) return
                } else {
                    const totalAssets = assets.length;
                    if (!totalAssets) {
                        return;
                    }
                    add = next ? 1 : -1
                    currentAsset = (currentAsset + add + totalAssets) % totalAssets;
                    asset = getAssetByIndex(currentAsset);
                }
                setupProductUrls(asset)                
            }

            function isGlbFile(file) {
                if (!file) return false;
                const lowerName = file.name.toLowerCase();
                return file.type === "model/gltf-binary" || lowerName.endsWith(".glb");
            }

            function upsertAsset({ url, name, revokable = false }) {
                const existingIndex = assets.findIndex((asset) => asset.url === url || asset.name === name);
                const nextAsset = { url, name, revokable };
                if (existingIndex >= 0) {
                    const existing = assets[existingIndex];
                    if (existing.revokable) {
                        URL.revokeObjectURL(existing.url);
                    }
                    assets[existingIndex] = nextAsset;
                    return existingIndex;
                }
                assets.push(nextAsset);
                return assets.length - 1;
            }

            function addDroppedModels(fileList) {
                const files = Array.from(fileList || []).filter(isGlbFile);
                if (!files.length) {
                    return;
                }
                let firstIndex = null;
                files.forEach((file) => {
                    const skuId = extractSkuId(file.name);
                    if (!skuId) {
                        return;
                    }
                    const url = URL.createObjectURL(file);
                    const name = skuId;
                    const index = upsertAsset({ url, name, revokable: true });
                    if (firstIndex === null) {
                        firstIndex = index;
                    }
                });
                if (firstIndex !== null) {
                    currentAsset = firstIndex;
                    setupProductUrls();
                }
            }

            function isValidGlbUrl(urlString) {
                try {
                    const url = new URL(urlString, window.location.href);
                    const pathname = url.pathname.toLowerCase();
                    return pathname.endsWith(".glb");
                } catch {
                    return false;
                }
            }

            function getNameFromUrl(rawUrl) {
                const cleaned = rawUrl.split("#")[0].split("?")[0];
                const lastSlash = cleaned.lastIndexOf("/");
                const filename = lastSlash >= 0 ? cleaned.slice(lastSlash + 1) : cleaned;
                if (!filename) {
                    return "remote-model";
                }
                const skuId = extractSkuId(filename);
                if (skuId) {
                    return skuId;
                }
                return filename.replace(/\.glb$/i, "") || filename;
            }

            async function addGlbUrl(rawUrl) {
                const trimmed = rawUrl.trim();
                if (!trimmed) {
                    return;
                }
                if (!isValidGlbUrl(trimmed)) {
                    alert("Please enter a valid .glb URL.");
                    return;
                }
                const name = getNameFromUrl(trimmed);
                let assetUrl = trimmed;
                let revokable = false;
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 15000);
                    const response = await fetch(trimmed, { signal: controller.signal, mode: "cors" });
                    clearTimeout(timeoutId);
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    const blob = await response.blob();
                    assetUrl = URL.createObjectURL(blob);
                    revokable = true;
                } catch (error) {
                    const message = error?.name === "AbortError"
                        ? "Download timed out. Please try again."
                        : "Unable to download the GLB (likely CORS blocked). Use a CORS-enabled URL or proxy.";
                    alert(message);
                    return;
                }

                currentAsset = upsertAsset({ url: assetUrl, name, revokable });
                setupProductUrls();
            }

            function updateExposure() {
                const exposure = exposureSlider.value;
                modelViewer.setAttribute('exposure', exposure);
                exposureValue.textContent = exposure;
            }

            function buildToneMappingOptions() {
                toneMappingSelect.innerHTML = "";
                toneMappingOptions.forEach((option) => {
                    const element = document.createElement("option");
                    element.value = option.value;
                    element.textContent = option.label;
                    toneMappingSelect.appendChild(element);
                });
            }

            function updateToneMapping(nextValue) {
                const current = modelViewer.getAttribute("tone-mapping");
                const fallback = toneMappingOptions[0]?.value || "aces";
                const desired = nextValue || toneMappingSelect.value || current || fallback;
                const isKnown = toneMappingOptions.some((option) => option.value === desired);
                const selected = isKnown ? desired : fallback;
                toneMappingSelect.value = selected;
                modelViewer.setAttribute("tone-mapping", selected);
            }

            function isEnvFile(file) {
                if (!file) return false;
                const lowerName = file.name.toLowerCase();
                return lowerName.endsWith(".hdr") || lowerName.endsWith(".jpg") || lowerName.endsWith(".jpeg");
            }

            function addEnvFile(file) {
                if (!isEnvFile(file)) {
                    return;
                }
                const url = URL.createObjectURL(file);
                const name = file.name.replace(/\.(hdr|jpg|jpeg)$/i, "");
                envs.push({ url, name, revokable: true });
                currentEnv = envs.length - 1;
                updateEnv();
            }

            function addEnvFiles(fileList) {
                const files = Array.from(fileList || []).filter(isEnvFile);
                if (!files.length) {
                    return;
                }
                files.forEach((file) => {
                    addEnvFile(file);
                });
            }
            
            const modelViewer = document.querySelector('model-viewer');

            const changeSkyboxButton = document.getElementById('change-skybox-button');
            const skyboxName = document.getElementById('skybox-name');
            const changeEnvButton = document.getElementById('change-env-button');            
            const envName = document.getElementById('env-name');            
            const skuIdInput = document.getElementById('sku-id-input');
            const modelName = document.getElementById('model-name');     
            const modelIndex = document.getElementById('model-index');
            const changeModelRButton = document.getElementById('change-model-r-button');
            const changeModelLButton = document.getElementById('change-model-l-button');
            const exposureSlider = document.getElementById('exposure-slider');
            const exposureValue = document.getElementById('exposure-value');
            const dropzoneTarget = document.getElementById('dropzone-target');
            const browseGlbButton = document.getElementById('glb-browse-button');
            const urlGlbButton = document.getElementById('glb-url-button');
            const glbFileInput = document.getElementById('glb-file-input');
            const browseEnvButton = document.getElementById('browse-env-button');
            const envFileInput = document.getElementById('env-file-input');
            const toneMappingSelect = document.getElementById('tone-mapping-select');
            const controlsToggle = document.getElementById('controls-toggle');
            const controlsContainer = document.getElementById('test-controls-container');

            skuIdInput.style.display = 'none';

            changeSkyboxButton.addEventListener('click', () => {
                currentSkybox = (currentSkybox + 1) % skyboxImages.length;
                updateSkybox();
            });

            changeEnvButton.addEventListener('click', () => {
                currentEnv = (currentEnv + 1) % envs.length;
                updateEnv();
            })

            changeModelRButton.addEventListener('click', () => {
                onModelChangeEvent(true);
            });
            changeModelLButton.addEventListener('click', () => {
                onModelChangeEvent(false);
            });

            skuIdInput.addEventListener("keyup", ({key}) => {
                if (key === "Enter") {
                    onModelChangeEvent();
                }
            })

            exposureSlider.addEventListener('input', () => {
                updateExposure();
            });

            toneMappingSelect.addEventListener("change", (event) => {
                updateToneMapping(event.target.value);
            });

            controlsToggle.addEventListener("click", () => {
                const isCollapsed = controlsContainer.classList.toggle("is-collapsed");
                controlsToggle.setAttribute("aria-expanded", String(!isCollapsed));
                controlsToggle.textContent = isCollapsed ? "+" : "-";
            });

            browseGlbButton.addEventListener('click', () => {
                glbFileInput.click();
            });

            urlGlbButton.addEventListener('click', async () => {
                const input = prompt("Enter a .glb URL");
                if (input != null) {
                    await addGlbUrl(input);
                }
            });

            glbFileInput.addEventListener('change', (event) => {
                addDroppedModels(event.target.files);
                glbFileInput.value = "";
            });

            browseEnvButton.addEventListener('click', () => {
                envFileInput.click();
            });

            envFileInput.addEventListener('change', (event) => {
                addEnvFiles(event.target.files);
                envFileInput.value = "";
            });

            let dragCounter = 0;

            function showDropzone() {
                dropzoneTarget.classList.add('is-dragover');
            }

            function hideDropzone() {
                dropzoneTarget.classList.remove('is-dragover');
            }

            window.addEventListener('dragenter', (event) => {
                event.preventDefault();
                dragCounter += 1;
                showDropzone();
            });

            window.addEventListener('dragover', (event) => {
                event.preventDefault();
            });

            window.addEventListener('dragleave', (event) => {
                event.preventDefault();
                dragCounter = Math.max(0, dragCounter - 1);
                if (dragCounter === 0) {
                    hideDropzone();
                }
            });

            window.addEventListener('drop', (event) => {
                event.preventDefault();
                dragCounter = 0;
                hideDropzone();
                const files = Array.from(event.dataTransfer.files || []);
                const glbFiles = files.filter(isGlbFile);
                const envFiles = files.filter(isEnvFile);
                if (glbFiles.length) {
                    addDroppedModels(glbFiles);
                }
                if (envFiles.length) {
                    addEnvFiles(envFiles);
                }
            });

            window.addEventListener('beforeunload', () => {
                assets.forEach((asset) => {
                    if (asset.revokable) {
                        URL.revokeObjectURL(asset.url);
                    }
                });
                envs.forEach((env) => {
                    if (env.revokable) {
                        URL.revokeObjectURL(env.url);
                    }
                });
            });

            updateSkybox();
            updateEnv();            
            setupProductUrls();
            updateExposure();    
            buildToneMappingOptions();
            updateToneMapping();   
    </script>
</html>
